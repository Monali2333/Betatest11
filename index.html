<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Save 🌸</title>
  
  <!-- Tailwind CSS สำหรับจัดการความสวยงาม -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ฟอนต์ ไอติม (Itim) -->
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  
  <!-- Import Maps สำหรับเรียกใช้งาน React และ Lucide Icons ในไฟล์ HTML เดี่ยวๆ -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
  </script>
  
  <!-- Babel สำหรับแปลงโค้ด JSX ให้ทำงานบนบราวเซอร์ได้ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body { 
      font-family: 'Itim', cursive; 
      letter-spacing: 0.02em; 
      background-color: #FFF0F5;
    }
    .animate-fade-in { 
      animation: fadeIn 0.3s ease-in-out; 
    }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(5px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    /* ซ่อน Scrollbar ของ Textarea แต่ยังเลื่อนได้ */
    textarea::-webkit-scrollbar {
      display: none;
    }
    textarea {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  
  <!-- พื้นที่สำหรับแสดงผล React -->
  <div id="root"></div>

  <!-- โค้ด React ทั้งหมด -->
  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Wallet, TrendingUp, TrendingDown, Calendar, PieChart, Plus, 
      Edit3, Trash2, Search, Heart, Sparkles, Check, X, ShieldCheck, 
      Clock, AlertTriangle, Lock, ChevronLeft, ChevronRight, Image as ImageIcon,
      BarChart3, Target, BookOpen, Key
    } from 'lucide-react';

    // ข้อมูลตัวอย่างเริ่มต้น
    const INITIAL_DATA = [
      { id: '1', type: 'income', amount: 32000, category: 'เงินเดือน', date: new Date().toISOString().split('T')[0], note: 'เงินเดือนประจำเดือนนี้ 🌸', createdAt: new Date().toISOString() },
      { id: '2', type: 'expense', amount: 125, category: 'อาหารเครื่องดื่ม', date: new Date().toISOString().split('T')[0], note: 'ชาไข่มุกหวาน 25% 🧋', createdAt: new Date().toISOString() },
      { id: '3', type: 'expense', amount: 450, category: 'เสื้อผ้า', date: new Date().toISOString().split('T')[0], note: 'เสื้อกระต่ายน่ารัก 🐰', createdAt: new Date().toISOString() },
      { id: '4', type: 'expense', amount: 1200, category: 'ที่พัก', date: new Date(Date.now() - 86400000).toISOString().split('T')[0], note: 'ค่าน้ำค่าไฟเดือนนี้ ⚡', createdAt: new Date(Date.now() - 86400000).toISOString() },
      { id: '5', type: 'income', amount: 1500, category: 'งานฟรีแลนซ์', date: new Date(Date.now() - 86400000 * 2).toISOString().split('T')[0], note: 'ออกแบบ โลโก้คิวท์ๆ ✨', createdAt: new Date(Date.now() - 86400000 * 2).toISOString() }
    ];

    const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

    // ตัวเลือกอารมณ์ประจำวัน
    const MOODS = [
      { id: 'awesome', label: 'สุดยอด', type: 'awesome' },
      { id: 'good', label: 'ดี', type: 'good' },
      { id: 'normal', label: 'เฉยๆ', type: 'normal' },
      { id: 'sad', label: 'เศร้า', type: 'sad' },
      { id: 'stressed', label: 'เครียด', type: 'stressed' },
    ];

    const MOOD_EMOJIS = {
      awesome: '🤩',
      good: '😊',
      normal: '😐',
      sad: '🥺',
      stressed: '😫'
    };

    // Component ไอคอนหน้ายิ้มลายเส้น
    const MoodIcon = ({ type, isActive }) => {
      const color = isActive ? "#FF8DA1" : "#B09E9F";
      const strokeWidth = isActive ? "2.5" : "1.5";
      
      let faceElements = null;
      if (type === 'awesome') {
        faceElements = (
          <>
            <path d="M8 9C8 9 8.5 8 9.5 8C10.5 8 11 9 11 9" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M13 9C13 9 13.5 8 14.5 8C15.5 8 16 9 16 9" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M8 13.5C8 13.5 10 17 12 17C14 17 16 13.5 16 13.5H8Z" fill={isActive ? color : "none"} stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
          </>
        );
      } else if (type === 'good') {
        faceElements = (
          <>
            <path d="M8 9C8 9 8.5 8 9.5 8C10.5 8 11 9 11 9" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M13 9C13 9 13.5 8 14.5 8C15.5 8 16 9 16 9" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M8 14C8 14 9.5 16 12 16C14.5 16 16 14 16 14" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
          </>
        );
      } else if (type === 'normal') {
        faceElements = (
          <>
            <circle cx="8.5" cy="9.5" r="1" fill={color}/>
            <circle cx="15.5" cy="9.5" r="1" fill={color}/>
            <path d="M8 15H16" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
          </>
        );
      } else if (type === 'sad') {
        faceElements = (
          <>
            <path d="M8 9.5C8 9.5 8.5 8.5 9.5 8.5C10.5 8.5 11 9.5 11 9.5" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M13 9.5C13 9.5 13.5 8.5 14.5 8.5C15.5 8.5 16 9.5 16 9.5" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M8 16C8 16 9.5 14 12 14C14.5 14 16 16 16 16" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
          </>
        );
      } else if (type === 'stressed') {
        faceElements = (
          <>
            <path d="M7 8L10 10M10 8L7 10" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M14 8L17 10M17 8L14 10" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round"/>
            <path d="M8 15L10 14L12 15L14 14L16 15" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
          </>
        );
      }

      return (
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke={color} strokeWidth={strokeWidth}/>
          {faceElements}
        </svg>
      );
    };

    function App() {
      const [transactions, setTransactions] = useState(INITIAL_DATA);
      const [activeTab, setActiveTab] = useState('daily');
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [deletingItem, setDeletingItem] = useState(null);
      
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      
      const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem('adminPassword') || '1234');
      const [isChangePasswordOpen, setIsChangePasswordOpen] = useState(false);
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [passwordChangeSuccess, setPasswordChangeSuccess] = useState(false);

      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
      const [searchQuery, setSearchQuery] = useState('');

      const [calendarViewDate, setCalendarViewDate] = useState(new Date(selectedDate));

      const [dailyGoals, setDailyGoals] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('sweetSaveGoals')) || {};
        } catch {
          return {};
        }
      });
      const [goalInput, setGoalInput] = useState('');
      const [showGoalSavedFeedback, setShowGoalSavedFeedback] = useState(false);

      const [dailyMoods, setDailyMoods] = useState(() => {
        try {
          const savedData = JSON.parse(localStorage.getItem('sweetSaveMoods')) || {};
          const formattedData = {};
          Object.keys(savedData).forEach(date => {
            if (typeof savedData[date] === 'string') {
              formattedData[date] = { moodId: savedData[date], note: '' };
            } else {
              formattedData[date] = savedData[date];
            }
          });
          return formattedData;
        } catch {
          return {};
        }
      });

      const [noteInput, setNoteInput] = useState('');
      const [showSavedFeedback, setShowSavedFeedback] = useState(false);

      const [logo, setLogo] = useState(() => localStorage.getItem('shopLogo') || 'https://placehold.co/100x100/FFB6C1/FFFFFF?text=Logo');
      const [coverImage, setCoverImage] = useState(() => localStorage.getItem('shopCover') || 'https://placehold.co/800x300/FFE4E1/FF8DA1?text=Shop+Cover');
      const [shopName, setShopName] = useState(() => localStorage.getItem('shopName') || 'Sweet Save');
      const [isEditingName, setIsEditingName] = useState(false);
      const [tempShopName, setTempShopName] = useState('');

      const handleLogoChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const newLogo = event.target.result;
            setLogo(newLogo);
            try { localStorage.setItem('shopLogo', newLogo); } catch (err) {}
          };
          reader.readAsDataURL(file);
        }
      };

      const handleCoverChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const newCover = event.target.result;
            setCoverImage(newCover);
            try { localStorage.setItem('shopCover', newCover); } catch (err) {}
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveShopName = () => {
        const newName = tempShopName.trim() || 'Sweet Save';
        setShopName(newName);
        localStorage.setItem('shopName', newName);
        setIsEditingName(false);
      };

      useEffect(() => {
        setCalendarViewDate(new Date(selectedDate));
        setNoteInput(dailyMoods[selectedDate]?.note || '');
        setGoalInput(dailyGoals[selectedDate] || '');
        setShowSavedFeedback(false);
        setShowGoalSavedFeedback(false);
      }, [selectedDate]); 

      useEffect(() => {
        localStorage.setItem('sweetSaveMoods', JSON.stringify(dailyMoods));
      }, [dailyMoods]);
      
      useEffect(() => {
        localStorage.setItem('sweetSaveGoals', JSON.stringify(dailyGoals));
      }, [dailyGoals]);

      const [formData, setFormData] = useState({
        type: 'expense', amount: '', category: '', date: new Date().toISOString().split('T')[0], note: ''
      });

      const totals = useMemo(() => {
        return transactions.reduce((acc, curr) => {
          if (curr.type === 'income') acc.income += Number(curr.amount);
          else acc.expense += Number(curr.amount);
          acc.balance = acc.income - acc.expense;
          return acc;
        }, { income: 0, expense: 0, balance: 0 });
      }, [transactions]);

      const dailySummary = useMemo(() => {
        const filtered = transactions.filter(t => t.date === selectedDate);
        return filtered.reduce((acc, curr) => {
          if (curr.type === 'income') acc.income += Number(curr.amount);
          else acc.expense += Number(curr.amount);
          acc.balance = acc.income - acc.expense;
          return acc;
        }, { income: 0, expense: 0, balance: 0, items: filtered });
      }, [transactions, selectedDate]);

      const monthlySummary = useMemo(() => {
        const filtered = transactions.filter(t => t.date.startsWith(selectedMonth));
        const catTotals = {};

        const summary = filtered.reduce((acc, curr) => {
          const amt = Number(curr.amount);
          if (curr.type === 'income') acc.income += amt;
          else {
            acc.expense += amt;
            const catName = curr.category || 'อื่นๆ';
            catTotals[catName] = (catTotals[catName] || 0) + amt;
          }
          acc.balance = acc.income - acc.expense;
          return acc;
        }, { income: 0, expense: 0, balance: 0, items: filtered });

        const categoryBreakdown = Object.keys(catTotals).map(cat => ({
          name: cat,
          amount: catTotals[cat],
          percentage: summary.expense > 0 ? ((catTotals[cat] / summary.expense) * 100).toFixed(1) : 0
        })).sort((a, b) => b.amount - a.amount);

        return { ...summary, categoryBreakdown };
      }, [transactions, selectedMonth]);

      const filteredHistory = useMemo(() => {
        return transactions.filter(item => {
          const searchLower = searchQuery.toLowerCase();
          const matchNote = item.note?.toLowerCase().includes(searchLower) || false;
          const matchCat = item.category?.toLowerCase().includes(searchLower) || false;
          return matchNote || matchCat;
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions, searchQuery]);

      const datesWithTransactions = useMemo(() => {
        const set = new Set();
        transactions.forEach(t => set.add(t.date));
        return set;
      }, [transactions]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.amount || Number(formData.amount) <= 0) return;

        if (editingItem) {
          setTransactions(prev => prev.map(item => item.id === editingItem.id ? { ...item, ...formData, amount: Number(formData.amount) } : item));
        } else {
          const newItem = { id: Date.now().toString(), ...formData, amount: Number(formData.amount), createdAt: new Date().toISOString() };
          setTransactions(prev => [newItem, ...prev]);
        }
        closeModal();
      };

      const openAddModal = () => {
        setEditingItem(null);
        setFormData({ type: 'expense', amount: '', category: '', date: new Date().toISOString().split('T')[0], note: '' });
        setIsModalOpen(true);
      };

      const openEditModal = (item) => {
        setEditingItem(item);
        setFormData({ type: item.type, amount: item.amount, category: item.category || '', date: item.date, note: item.note || '' });
        setIsModalOpen(true);
      };

      const promptDelete = (item) => setDeletingItem(item);
      const confirmDelete = () => {
        if (deletingItem) {
          setTransactions(prev => prev.filter(t => t.id !== deletingItem.id));
          setDeletingItem(null);
        }
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingItem(null);
      };

      const handleAdminToggle = () => {
        if (isAdmin) {
          setIsAdmin(false);
          setIsEditingName(false);
          setIsChangePasswordOpen(false);
        } else {
          setIsLoginModalOpen(true);
          setPasswordInput('');
          setLoginError('');
        }
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (passwordInput === adminPassword) {
          setIsAdmin(true);
          setIsLoginModalOpen(false);
          setPasswordInput('');
          setLoginError('');
        } else setLoginError('รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้งนะ 🥺');
      };

      const closeLoginModal = () => {
        setIsLoginModalOpen(false);
        setPasswordInput('');
        setLoginError('');
      };

      const handlePasswordChangeSubmit = (e) => {
        e.preventDefault();
        if (newPasswordInput.trim().length > 0) {
          const updatedPwd = newPasswordInput.trim();
          setAdminPassword(updatedPwd);
          localStorage.setItem('adminPassword', updatedPwd);
          setPasswordChangeSuccess(true);
          setNewPasswordInput('');
          setTimeout(() => setPasswordChangeSuccess(false), 2500);
        }
      };

      const handleSaveGoal = () => {
        if (!goalInput.trim()) {
          handleDeleteGoal();
          return;
        }
        setDailyGoals(prev => ({ ...prev, [selectedDate]: goalInput.trim() }));
        setShowGoalSavedFeedback(true);
        setTimeout(() => setShowGoalSavedFeedback(false), 2000);
      };

      const handleDeleteGoal = () => {
        setDailyGoals(prev => {
          const next = { ...prev };
          delete next[selectedDate];
          return next;
        });
        setGoalInput('');
      };

      const handleMoodSelect = (moodId) => {
        setDailyMoods(prev => {
          const currentDayData = prev[selectedDate] || { moodId: null, note: '' };
          if (currentDayData.moodId === moodId) {
            return { ...prev, [selectedDate]: { ...currentDayData, moodId: null } };
          }
          return { ...prev, [selectedDate]: { ...currentDayData, moodId } };
        });
      };

      const handleSaveNote = () => {
        setDailyMoods(prev => {
          const currentDayData = prev[selectedDate] || { moodId: null, note: '' };
          return { ...prev, [selectedDate]: { ...currentDayData, note: noteInput } };
        });
        setShowSavedFeedback(true);
        setTimeout(() => setShowSavedFeedback(false), 2000);
      };

      const formatMoney = (val) => Number(val).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      const formatThaiDate = (dateString) => {
        if (!dateString) return '';
        return new Date(dateString).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };
      const formatThaiMonth = (monthString) => {
        if (!monthString) return '';
        const [year, month] = monthString.split('-');
        return new Date(year, month - 1).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
      };
      const getLocalISODate = (dateObj) => {
        const y = dateObj.getFullYear();
        const monthStr = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${monthStr}-${d}`;
      };

      return (
        <div className="text-[#5A4549] pb-12 selection:bg-pink-200">
          
          {/* Top Navbar */}
          <header className="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b-2 border-pink-100 shadow-sm py-3 px-4">
            <div className="max-w-md mx-auto flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className={`relative w-14 h-14 rounded-full bg-[#FFF0F5] border-[3px] border-white shadow-sm shadow-pink-200 overflow-hidden shrink-0 flex items-center justify-center transition-transform group ${isAdmin ? 'cursor-pointer hover:scale-105' : ''}`}>
                  {isAdmin && (
                    <input type="file" accept="image/*" onChange={handleLogoChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" title="คลิกเพื่อเปลี่ยนรูปโลโก้" />
                  )}
                  <img src={logo} alt="Shop Logo" className="w-full h-full object-cover" />
                </div>

                <div>
                  {isEditingName && isAdmin ? (
                    <div className="flex items-center gap-1 mb-0.5">
                      <input autoFocus type="text" value={tempShopName} onChange={(e) => setTempShopName(e.target.value)} onBlur={handleSaveShopName} onKeyDown={(e) => e.key === 'Enter' && handleSaveShopName()} className="font-bold text-lg text-[#FF8DA1] bg-white border border-pink-200 rounded-md px-2 py-0.5 w-32 focus:outline-none focus:ring-1 focus:ring-pink-300 leading-none" placeholder="ชื่อร้าน..." />
                    </div>
                  ) : (
                    <h1 className="font-bold text-lg text-[#FF8DA1] flex items-center gap-1.5 leading-none">
                      {shopName} <Sparkles className="w-4 h-4 animate-pulse text-[#FFB6C1]" />
                      {isAdmin && (
                        <button onClick={() => { setTempShopName(shopName); setIsEditingName(true); }} className="text-[#FFB6C1] hover:text-[#FF8DA1] transition-colors ml-0.5 p-1 bg-[#FFF0F5] hover:bg-pink-100 rounded-full" title="แก้ไขชื่อร้าน"><Edit3 className="w-3 h-3" /></button>
                      )}
                    </h1>
                  )}
                  <p className="text-[10px] text-[#FFB6C1] mt-0.5">บันทึกรายรับรายจ่ายของฉัน</p>
                </div>
              </div>

              <button onClick={handleAdminToggle} className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-[10px] transition-all border ${isAdmin ? 'bg-[#FF8DA1] text-white border-[#FF8DA1] shadow-sm shadow-pink-200' : 'bg-white text-[#FF8DA1] border-pink-200 hover:bg-pink-50'}`}>
                <ShieldCheck className="w-3.5 h-3.5" />
                <span>{isAdmin ? 'บันทึก' : 'ตั้งค่า'}</span>
              </button>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-md mx-auto px-4 pt-5 space-y-5">

            {/* 🌸 ปกร้าน 🌸 */}
            <div className="relative w-full h-36 rounded-[24px] overflow-hidden shadow-sm border border-pink-100 group">
              {isAdmin && (
                <input type="file" accept="image/*" onChange={handleCoverChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" title="คลิกเพื่อเปลี่ยนรูปร้าน" />
              )}
              <img src={coverImage} alt="Shop Cover" className="w-full h-full object-cover" />
              {isAdmin && (
                <div className="absolute inset-0 bg-white/20 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10 pointer-events-none">
                  <div className="bg-white text-[#FF8DA1] px-3 py-1.5 rounded-full text-[12px] font-bold shadow-md flex items-center gap-1.5"><ImageIcon className="w-3.5 h-3.5" /> เปลี่ยนรูปปกร้าน</div>
                </div>
              )}
            </div>

            {/* แผงเปลี่ยนรหัสผ่านแอดมิน */}
            {isAdmin && (
              <div className="bg-white rounded-[24px] p-4 shadow-sm border border-pink-100 flex flex-col gap-3 animate-fade-in">
                <div className="flex items-center justify-between">
                  <span className="text-[12px] text-[#FF8DA1] font-bold flex items-center gap-1.5"><Key className="w-4 h-4" /> เปลี่ยนรหัสผ่านหลังบ้าน</span>
                  <button onClick={() => setIsChangePasswordOpen(!isChangePasswordOpen)} className="text-[10px] bg-[#FFF0F5] text-[#FF8DA1] px-3 py-1 rounded-full hover:bg-pink-100 transition-colors">
                    {isChangePasswordOpen ? 'ซ่อน' : 'เปลี่ยนรหัสผ่าน'}
                  </button>
                </div>
                
                {isChangePasswordOpen && (

                  )}
                </div>

                <div className="bg-white rounded-[24px] p-4 shadow-sm border border-pink-100">
                  <h3 className="text-[12px] text-[#FF8DA1] mb-3 flex items-center gap-1.5"><Calendar className="w-3 h-3" /> รายการเดือนนี้ ({monthlySummary.items.length})</h3>
                  {monthlySummary.items.length === 0 ? <div className="text-center py-6 text-[#D1C3C5] text-[11px]">ไม่มีรายการบันทึกค่ะ</div> : (
                    <div className="space-y-2">
                      {monthlySummary.items.map(item => <TransactionRow key={item.id} item={item} isAdmin={isAdmin} onEdit={openEditModal} onDelete={promptDelete} showDate />)}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 3: HISTORY */}
            {activeTab === 'history' && (
              <div className="space-y-4 animate-fade-in">
                <div className="bg-white p-2 rounded-full shadow-sm border border-pink-100 relative flex items-center">
                  <Search className="w-4 h-4 ml-3 text-[#FFB6C1]" />
                  <input type="text" placeholder="ค้นหา (เช่น อาหาร, กาแฟ)..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-2 pr-4 py-1.5 border-none bg-transparent text-[12px] focus:outline-none text-[#5A4549] placeholder-[#D1C3C5]" />
                </div>

                <div className="bg-white rounded-[24px] p-4 shadow-sm border border-pink-100">
                  <h3 className="text-[12px] text-[#FF8DA1] mb-3 flex items-center gap-1.5"><Clock className="w-3 h-3" /> ประวัติทั้งหมด ({filteredHistory.length})</h3>
                  {filteredHistory.length === 0 ? <div className="text-center py-10 text-[#D1C3C5] text-[11px]">ไม่พบบันทึกค่ะ ☁️</div> : (
                    <div className="space-y-2">
                      {filteredHistory.map(item => <TransactionRow key={item.id} item={item} isAdmin={isAdmin} onEdit={openEditModal} onDelete={promptDelete} showDate />)}
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* ========================================== */}
          {/* MODALS */}
          {/* ========================================== */}
          
          {/* ADMIN LOGIN */}
          {isLoginModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#FFB6C1]/20 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-[32px] max-w-[280px] w-full p-6 shadow-xl border border-pink-100 relative animate-fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-[16px] text-[#FF8DA1] flex items-center gap-1.5"><Lock className="w-4 h-4" /> เข้าสู่ระบบหลังบ้าน</h3>
                  <button onClick={closeLoginModal} className="w-7 h-7 rounded-full bg-[#FFF0F5] text-[#FF8DA1] hover:bg-pink-100 flex items-center justify-center transition-colors"><X className="w-3.5 h-3.5" /></button>
                </div>
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-[11px] text-[#B09E9F] mb-1 pl-2 text-center">กรุณาใส่รหัสผ่านเพื่อแก้ไข/ลบข้อมูล 🌸</label>
                    <input type="password" required placeholder="รหัสผ่าน..." value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full text-center px-4 py-2.5 bg-[#FFF0F5] border-none rounded-2xl text-[14px] text-[#5A4549] focus:outline-none focus:ring-2 focus:ring-[#FF8DA1] mt-2" />
                  </div>
                  {loginError && <p className="text-[10px] text-[#FF6B6B] text-center animate-pulse">{loginError}</p>}
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={closeLoginModal} className="flex-1 py-2 bg-white border border-pink-200 text-[#FF8DA1] rounded-full text-[12px] hover:bg-pink-50 transition-colors">ยกเลิก</button>
                    <button type="submit" className="flex-1 py-2 bg-[#FF8DA1] hover:bg-[#FF7A92] text-white rounded-full text-[12px] shadow-sm transition-all">ตกลง</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD / EDIT TRANSACTION */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#FFB6C1]/20 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-[32px] max-w-sm w-full p-6 shadow-xl border border-pink-100 relative animate-fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-[16px] text-[#FF8DA1] flex items-center gap-1.5"><Heart className="w-4 h-4 fill-[#FF8DA1]" /> {editingItem ? 'แก้ไขรายการ' : 'เพิ่มรายการใหม่'}</h3>
                  <button onClick={closeModal} className="w-7 h-7 rounded-full bg-[#FFF0F5] text-[#FF8DA1] hover:bg-pink-100 flex items-center justify-center transition-colors"><X className="w-3.5 h-3.5" /></button>
                </div>
                <form onSubmit={handleSubmit} className="space-y-3">
                  <div className="flex p-1 bg-[#FFF0F5] rounded-full">
                    <button type="button" onClick={() => setFormData({ ...formData, type: 'income' })} className={`flex-1 py-1.5 rounded-full text-[11px] transition-all flex items-center justify-center gap-1 ${formData.type === 'income' ? 'bg-white text-[#58A36E] shadow-sm' : 'text-[#B09E9F]'}`}><TrendingUp className="w-3 h-3" /> รายรับ</button>
                    <button type="button" onClick={() => setFormData({ ...formData, type: 'expense' })} className={`flex-1 py-1.5 rounded-full text-[11px] transition-all flex items-center justify-center gap-1 ${formData.type === 'expense' ? 'bg-white text-[#FF8DA1] shadow-sm' : 'text-[#B09E9F]'}`}><TrendingDown className="w-3 h-3" /> รายจ่าย</button>
                  </div>
                  <div>
                    <label className="block text-[11px] text-[#B09E9F] mb-1 pl-2">จำนวนเงิน (บาท) *</label>
                    <div className="relative">
                      <input type="number" step="any" required placeholder="0.00" value={formData.amount} onChange={(e) => setFormData({ ...formData, amount: e.target.value })} className="w-full pl-8 pr-4 py-2.5 bg-[#FFF0F5] border-none rounded-2xl text-[14px] text-[#5A4549] focus:outline-none focus:ring-2 focus:ring-[#FF8DA1]" />
                      <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[#FF8DA1]">฿</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-[11px] text-[#B09E9F] mb-1 pl-2">หมวดหมู่ *</label>
                    <input type="text" required placeholder="เช่น อาหาร, เดินทาง" value={formData.category} onChange={(e) => setFormData({ ...formData, category: e.target.value })} className="w-full px-4 py-2.5 bg-[#FFF0F5] border-none rounded-2xl text-[12px] text-[#5A4549] focus:outline-none focus:ring-2 focus:ring-[#FF8DA1]" />
                  </div>
                  
                  <div className="w-full relative">
                    <label className="block text-[11px] text-[#B09E9F] mb-1 pl-2">วันที่</label>
                    <div className="w-full bg-[#FFF0F5] rounded-2xl px-4 overflow-hidden focus-within:ring-2 focus-within:ring-[#FF8DA1]">
                      <input type="date" required value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} className="w-full py-2.5 bg-transparent border-none text-[12px] text-[#5A4549] focus:outline-none min-w-0 block" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] text-[#B09E9F] mb-1 pl-2">รายละเอียด (ตัวเลือก)</label>
                    <input type="text" placeholder="เช่น กาแฟ ☕" value={formData.note} onChange={(e) => setFormData({ ...formData, note: e.target.value })} className="w-full px-4 py-2.5 bg-[#FFF0F5] border-none rounded-2xl text-[12px] text-[#5A4549] focus:outline-none focus:ring-2 focus:ring-[#FF8DA1]" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={closeModal} className="flex-1 py-2.5 bg-white border border-pink-200 text-[#FF8DA1] rounded-full text-[12px] hover:bg-pink-50 transition-colors">ยกเลิก</button>
                    <button type="submit" className="flex-1 py-2.5 bg-[#FF8DA1] hover:bg-[#FF7A92] text-white rounded-full text-[12px] shadow-md shadow-pink-200 transition-all flex items-center justify-center gap-1"><Check className="w-3 h-3" /> {editingItem ? 'บันทึก' : 'เพิ่ม'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CUSTOM DELETE CONFIRMATION */}
          {deletingItem && (
            <div className="fixed inset-0 z-50 bg-[#FFB6C1]/20 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-[32px] max-w-[280px] w-full p-5 shadow-xl border border-pink-100 text-center space-y-3 animate-fade-in">
                <div className="w-10 h-10 rounded-full bg-[#FFF5F5] text-[#E07A7A] flex items-center justify-center mx-auto"><AlertTriangle className="w-5 h-5" /></div>
                <div>
                  <h3 className="text-[14px] text-[#5A4549]">ลบรายการนี้ไหมคะ? 🌸</h3>
                  <p className="text-[11px] text-[#B09E9F] mt-1">"{deletingItem.note || deletingItem.category}"<br/>(฿{Number(deletingItem.amount).toLocaleString()})</p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setDeletingItem(null)} className="flex-1 py-2 bg-[#F5F5F5] text-[#5A4549] rounded-full text-[11px] hover:bg-gray-200 transition-colors">ยกเลิก</button>
                  <button onClick={confirmDelete} className="flex-1 py-2 bg-[#E07A7A] hover:bg-[#D66B6B] text-white rounded-full text-[11px] shadow-sm transition-all flex items-center justify-center gap-1"><Trash2 className="w-3 h-3" /> ลบ</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Component: Transaction Row
    function TransactionRow({ item, isAdmin, onEdit, onDelete, showDate = false }) {
      const isIncome = item.type === 'income';
      return (
        <div className="p-2.5 bg-white hover:bg-[#FFF0F5] rounded-2xl border border-pink-100/50 transition-all flex items-center justify-between group shadow-[0_2px_8px_rgba(255,192,203,0.1)]">
          <div className="flex items-center space-x-2 min-w-0">
            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm shrink-0 ${isIncome ? 'bg-[#EAF5ED] text-[#58A36E]' : 'bg-[#FFF0F5] text-[#FF8DA1]'}`}>{isIncome ? '💚' : '🍓'}</div>
            <div className="truncate flex flex-col justify-center">
              <div className="flex items-center gap-1.5"><p className="text-[12px] text-[#5A4549] truncate leading-none">{item.note || item.category || (isIncome ? 'รายรับ' : 'รายจ่าย')}</p></div>
              <div className="flex items-center gap-1 mt-1">
                <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-[#F5F5F5] text-[#8C7A7D]">{item.category || (isIncome ? 'รายรับ' : 'รายจ่าย')}</span>
                {showDate && <span className="text-[9px] text-[#D1C3C5]">{item.date}</span>}
              </div>
            </div>
          </div>
          <div className="flex items-center space-x-2 shrink-0">
            <span className={`text-[13px] font-normal ${isIncome ? 'text-[#58A36E]' : 'text-[#FF8DA1]'}`}>{isIncome ? '+' : '-'}฿{Number(item.amount).toLocaleString()}</span>
            {isAdmin && (
              <div className="flex items-center space-x-0.5 pl-1.5 border-l border-pink-100">
                <button onClick={() => onEdit(item)} className="p-1 text-[#FFB6C1] hover:text-[#FF8DA1] hover:bg-[#FFF0F5] rounded-full transition-colors"><Edit3 className="w-3.5 h-3.5" /></button>
                <button onClick={() => onDelete(item)} className="p-1 text-[#FFB6C1] hover:text-[#E07A7A] hover:bg-[#FFF5F5] rounded-full transition-colors"><Trash2 className="w-3.5 h-3.5" /></button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render 
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
